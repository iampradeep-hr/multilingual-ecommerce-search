spring.application.name=quick-commerce-api
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mila}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
mila.kafka.topics.ingest=${KAFKA_TOPIC_PREFIX:mila.}products.ingest
mila.kafka.topics.index=${KAFKA_TOPIC_PREFIX:mila.}products.index
mila.gemma.provider=${GEMMA_PROVIDER:ollama}
mila.gemma.url=${OLLAMA_URL:http://localhost:11434}
mila.gemma.token=${MILA_TAG_SERVICE_TOKEN:}
mila.gemma.model=${GEMMA_MODEL:gemma3:4b}
mila.typesense.enabled=${TYPESENSE_ENABLED:false}
mila.typesense.url=${TYPESENSE_URL:http://localhost:8108}
mila.typesense.api-key=${TYPESENSE_API_KEY:}
spring.security.user.name=${MILA_ADMIN_USERNAME:root}
spring.security.user.password=${MILA_ADMIN_PASSWORD:root}
