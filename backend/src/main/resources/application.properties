spring.application.name=quick-commerce-api
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jaldi}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
jaldi.kafka.topics.ingest=${KAFKA_TOPIC_PREFIX:jaldi.}products.ingest
jaldi.kafka.topics.index=${KAFKA_TOPIC_PREFIX:jaldi.}products.index
jaldi.gemma.provider=${GEMMA_PROVIDER:ollama}
jaldi.gemma.url=${OLLAMA_URL:http://localhost:11434}
jaldi.gemma.token=${GEMMA_TAG_SERVICE_TOKEN:}
jaldi.gemma.model=${GEMMA_MODEL:gemma3:4b}
jaldi.typesense.enabled=${TYPESENSE_ENABLED:false}
jaldi.typesense.url=${TYPESENSE_URL:http://localhost:8108}
jaldi.typesense.api-key=${TYPESENSE_API_KEY:}
spring.security.user.name=${JALDI_ADMIN_USERNAME:root}
spring.security.user.password=${JALDI_ADMIN_PASSWORD:root}
